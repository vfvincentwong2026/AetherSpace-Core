# Path: workers/api-worker/wrangler.toml

name = "aetherspace-api-worker"
main = "src/index.ts"
compatibility_date = "2026-03-01"

[vars]
ENVIRONMENT = "production"

# Cloudflare D1 数据库绑定配置
[[d1_databases]]
binding = "AETHER_DB"
database_name = "aether-space-db"
database_id = "your-cloudflare-d1-database-id-here"
